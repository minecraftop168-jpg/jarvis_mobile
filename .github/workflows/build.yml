name: Flutter APK Cloud Compiler

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Initialize Java Core Environment
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Deploy Flutter SDK Engine
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Assemble Workspace and Packages
      run: |
        flutter create --org com.jarvis jarvis_app
        cd jarvis_app
        flutter pub add http speech_to_text installed_apps flutter_tts

    - name: Write Custom Main Code
      run: |
        cat << 'EOF' > jarvis_app/lib/main.dart
        import 'package:flutter/material.dart';
        import 'package:http/http.dart' as http;
        import 'dart:convert';
        import 'package:speech_to_text/speech_to_text.dart' as stt;
        import 'package:installed_apps/installed_apps.dart';
        import 'package:flutter_tts/flutter_tts.dart';

        void main() => runApp(const JarvisMobileEngine());

        class JarvisMobileEngine extends StatelessWidget {
          const JarvisMobileEngine({super.key});
          @override
          Widget build(BuildContext context) {
            return MaterialApp(
              debugShowCheckedModeBanner: false,
              theme: ThemeData.dark().copyWith(
                primaryColor: Colors.cyan,
                scaffoldBackgroundColor: const Color(0xFF060911),
              ),
              home: const JarvisCorePanel(),
            );
          }
        }

        class JarvisCorePanel extends StatefulWidget {
          const JarvisCorePanel({super.key});
          @override
          State<JarvisCorePanel> createState() => _JarvisCorePanelState();
        }

        class _JarvisCorePanelState extends State<JarvisCorePanel> {
          final String pcIpAddress = '192.168.1.8';
          late stt.SpeechToText _speech;
          late FlutterTts _tts;
          bool _isListening = false;
          String _terminalLogs = "JARVIS AGENT: ACTIVE";

          @override
          void initState() {
            super.initState();
            _speech = stt.SpeechToText();
            _tts = FlutterTts();
            _initJarvisVoice();
          }

          void _initJarvisVoice() async {
            await _tts.setLanguage("en-IN"); 
            await _tts.setSpeechRate(0.5);
            bool available = await _speech.initialize();
            if (available) { 
              _jarvisSpeak("Systems fully synchronized. Awaiting orders, sir.");
              startVoiceScanningLoop(); 
            }
          }

          void _jarvisSpeak(String text) async {
            setState(() { _terminalLogs = "Jarvis: $text\n$_terminalLogs"; });
            await _tts.speak(text);
          }

          void startVoiceScanningLoop() {
            setState(() => _isListening = true);
            _speech.listen(
              onResult: (result) async {
                if (result.finalResult) {
                  String input = result.recognizedWords.toLowerCase().trim();
                  setState(() { _terminalLogs = "Heard: '$input'\n$_terminalLogs"; });

                  // 1. CHAT CONVERSATION TRICK: Checks for Roman Urdu Phrases locally
                  if (input.contains("idar hu") || input.contains("idhar ho") || input.contains("where are you")) {
                    _jarvisSpeak("At your service, sir. I am right here.");
                  } 
                  // 2. CROSS-DEVICE TRIGGER: Open apps directly on your PC screen
                  else if (input.startsWith("open app in my pc") || input.contains("in pc")) {
                    String pcApp = input.replaceAll("open app in my pc", "").replaceAll("in pc", "").replaceAll("open", "").trim();
                    _jarvisSpeak("Launching $pcApp on your workstation screen, sir.");
                    routeCommandToPcExe(pcApp);
                  } 
                  // 3. LOCAL SMART TRIGGER: Open apps on your phone screen
                  else if (input.startsWith("open app") || input.startsWith("open")) {
                    String mobileApp = input.replaceAll("open app", "").replaceAll("open", "").trim();
                    _jarvisSpeak("Deploying $mobileApp on your mobile interface.");
                    launchNativeMobileApp(mobileApp);
                  }
                  
                  // Instantly restarts loop so it never stops listening to your voice
                  startVoiceScanningLoop();
                }
              },
            );
          }

          void launchNativeMobileApp(String appQuery) async {
            try {
              String packageId = "com.android.chrome"; 
              if (appQuery.contains("whatsapp")) packageId = "com.whatsapp";
              if (appQuery.contains("facebook")) packageId = "com.facebook.katana";
              if (appQuery.contains("youtube")) packageId = "com.google.android.youtube"; 
              if (appQuery.contains("dialer") || appQuery.contains("call")) packageId = "com.android.dialer";

              await InstalledApps.startApp(packageId);
            } catch (e) { _jarvisSpeak("Package target missing from device storage."); }
          }

          void routeCommandToPcExe(String targetCommand) async {
            final url = Uri.parse('http://$pcIpAddress:5000/command');
            try {
              await http.post(
                url,
                headers: {"Content-Type": "application/json"},
                body: jsonEncode({"command": targetCommand}),
              );
            } catch (e) { _jarvisSpeak("Unable to reach your computer network server."); }
          }

          @override
          Widget build(BuildContext context) {
            return Scaffold(
              body: Center(
                child: Container(
                  padding: const EdgeInsets.all(24),
                  child: Text(_terminalLogs, textAlign: TextAlign.center, style: const TextStyle(fontFamily: 'monospace', color: Colors.greenAccent, fontSize: 13)),
                ),
              ),
            );
          }
        }
        EOF

    - name: Execute Standalone APK Compilation
      run: |
        cd jarvis_app
        flutter build apk --release

    - name: Export Output Application Binaries
      uses: actions/upload-artifact@v4
      with:
        name: Standalone-Jarvis-APK
        path: jarvis_app/build/app/outputs/flutter-apk/app-release.apk
